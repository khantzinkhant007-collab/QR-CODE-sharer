server {
    listen 80;
    server_name 15.168.129.246;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://15.168.129.246$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name 15.168.129.246;
    ssl_certificate /etc/letsencrypt/live/scansend-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scansend-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/scansend/current/frontend/dist;
    index index.html;
    client_max_body_size 2100m;
    client_body_timeout 1800s;
    send_timeout 1800s;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(self), microphone=(), geolocation=()' always;
    location ~ /\. { deny all; }
    location ~ \.php(?:/|$) { return 404; }
    location /api/ { try_files /__no_static_api__ @laravel; }
    location /d/ { try_files /__no_static_download__ @laravel; }
    location = /up { try_files /__no_static_health__ @laravel; }
    location = /download.css { root /var/www/scansend/current/backend/public; }
    location = /hero-dusk.webp { root /var/www/scansend/current/backend/public; }
    location @laravel {
        root /var/www/scansend/current/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/scansend/current/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 1800s;
        fastcgi_request_buffering off;
        fastcgi_hide_header X-Powered-By;
    }
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /index.html { expires -1; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
